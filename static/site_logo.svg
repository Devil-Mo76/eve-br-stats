<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="BR 战斗统计系统">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243a"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0077c2"/>
      <stop offset="1" stop-color="#00d0ff"/>
    </linearGradient>
  </defs>

  <!-- 背板 -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)" stroke="#00bfff" stroke-opacity="0.45" stroke-width="4"/>

  <!-- 准星环 -->
  <circle cx="128" cy="112" r="60" fill="none" stroke="#00bfff" stroke-opacity="0.55" stroke-width="6"/>
  <circle cx="128" cy="112" r="22" fill="none" stroke="#00bfff" stroke-width="8"/>

  <!-- 准星刻度 -->
  <g stroke="#00bfff" stroke-width="8" stroke-linecap="round">
    <line x1="128" y1="34" x2="128" y2="58"/>
    <line x1="128" y1="166" x2="128" y2="190"/>
    <line x1="50"  y1="112" x2="74"  y2="112"/>
    <line x1="182" y1="112" x2="206" y2="112"/>
  </g>

  <!-- 底部统计柱 -->
  <g fill="url(#bar)">
    <rect x="70"  y="196" width="24" height="30" rx="6"/>
    <rect x="104" y="184" width="24" height="42" rx="6"/>
    <rect x="138" y="170" width="24" height="56" rx="6"/>
    <rect x="172" y="158" width="24" height="68" rx="6"/>
  </g>
</svg>
