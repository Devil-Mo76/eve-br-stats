{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4 text-center">{{ site_name }} v{{ site_version }}</h1>

    <!-- BR链接输入 -->
    <div class="card mb-4 mx-auto" style="max-width: 800px;">
        <div class="card-header">提交BR链接</div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('index') }}" onsubmit="showLoading(); return true;">
                <!-- 日期和名称输入 -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">选择报告日期</label>
                        <input type="date" class="form-control" name="report_date" required
                               value="{{ request.form.report_date or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">自定义报告名称</label>
                        <input type="text" class="form-control" name="custom_name"
                               placeholder="请输入报告名称" maxlength="50" required
                               value="{{ request.form.custom_name or '' }}">
                    </div>
                </div>

                <!-- BR链接输入框 -->
                <div class="mb-3">
                    <label class="form-label">粘贴BR链接（每行一个）</label>
                    <textarea class="form-control" name="br_links" rows="20"
                        placeholder="例：https://br.evetools.org/br/...&#10;       https://br.evetools.org/br/..."
                        id="brInput" oninput="validateBR()">{{ br_links_text or '' }}</textarea>
                    <div id="brValidation" class="mt-2"></div>
                </div>

                <!-- 操作按钮 -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success" id="submitBtn">
                        <i class="fas fa-play me-2"></i>生成报告
                    </button>
                    {% if latest_report %}
                    <a href="{{ url_for('download_report', filename=latest_report) }}" class="btn btn-info">
                        <i class="fas fa-download me-2"></i>下载最新报告
                    </a>
                    {% endif %}
                </div>

                <!-- 状态提示 -->
                {% if br_valid %}
                <div class="alert alert-success mt-3">BR报告生成完毕，您可以下载报告！</div>
                {% endif %}
                {% if error %}
                <div class="alert alert-danger mt-3">{{ error }}</div>
                {% endif %}
                <div id="loading" class="mt-3" style="display: none;">
                    <div class="progress">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                             role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <div id="progressText" class="text-center mt-2">准备启动分析引擎...</div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // BR 链接格式来自 config.py 的 BR_LINK_PATTERN，改配置即可同步前后端校验规则
    const BR_PATTERN = new RegExp({{ br_link_pattern | tojson }});

    // BR链接实时验证
    function validateBR() {
        const input = document.getElementById('brInput');
        const validation = document.getElementById('brValidation');

        const lines = input.value.split('\n').filter(line => line.trim() !== '');
        const validCount = lines.filter(line => BR_PATTERN.test(line.trim())).length;

        if (lines.length === 0) {
            validation.innerHTML = '<span class="text-warning"><i class="fas fa-info-circle me-1"></i>请输入至少一个 BR 链接</span>';
        } else if (validCount === lines.length) {
            validation.innerHTML = `<span class="text-success"><i class="fas fa-check-circle me-1"></i>共 ${validCount} 条链接，格式全部正确</span>`;
        } else {
            validation.innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i>共 ${lines.length} 条链接，其中 ${lines.length - validCount} 条格式无效</span>`;
        }
    }

    // 加载动画 + 实际提交
    function showLoading() {
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>处理中...';

        const loading = document.getElementById('loading');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progressText');
        loading.style.display = 'block';

        progressBar.style.width = '0%';
        progressBar.classList.add('progress-bar-animated');
        progressBar.setAttribute('aria-valuenow', 0);

        // 第一阶段：快速动画到 66%
        animateProgress(progressBar, 66, 800, (current) => {
            progressText.textContent = `正在初始化 (${current}%)...`;
        }).then(() => {
            progressText.textContent = "正在分析战斗数据，请稍候...";

            // 第二阶段：实际提交表单
            const form = document.querySelector('form');
            return fetch(form.action, {
                method: 'POST',
                body: new FormData(form)
            });
        }).then(response => {
            if (!response.ok) {
                throw new Error('服务器处理失败');
            }
            // 第三阶段：成功推进到 100%
            return animateProgress(progressBar, 100, 300, (current) => {
                progressText.textContent = `生成最终报告 (${current}%)...`;
            });
        }).then(() => {
            progressText.innerHTML = '<i class="fas fa-check-circle text-success me-2"></i>报告生成完成！';
            setTimeout(() => window.location.reload(), 1500);
        }).catch(error => {
            progressBar.classList.remove('progress-bar-animated');
            progressBar.classList.add('bg-danger');
            progressBar.style.width = '100%';
            progressText.innerHTML = `<i class="fas fa-times-circle text-danger me-2"></i>${error.message}`;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-play me-2"></i>重试';
        });
    }

    // 平滑动画函数
    function animateProgress(element, targetPercent, duration, onUpdate) {
        return new Promise((resolve) => {
            let startTime = null;

            const step = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const current = Math.floor(progress * targetPercent);

                element.style.width = `${current}%`;
                element.setAttribute('aria-valuenow', current);

                if (typeof onUpdate === 'function') {
                    onUpdate(current);
                }

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    resolve();
                }
            };

            requestAnimationFrame(step);
        });
    }

    // 页面加载时先跑一次校验，回显历史链接也能看到结果
    document.addEventListener('DOMContentLoaded', validateBR);
</script>
{% endblock %}
